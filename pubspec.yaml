name: retail_app
description: A Flutter application for retail with performance optimizations.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.6.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  provider: 6.1.2
  dio: 5.7.0
  cached_network_image: 3.4.1
  shared_preferences: 2.3.3
  cupertino_icons: ^1.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  mockito: 5.4.4
  build_runner: 2.4.13
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/